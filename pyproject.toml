[build-system]
requires = ["setuptools>=78.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-tracker"
version = "1.0.0"
description = "Context window forensics for Claude Code: track token usage, find dead weight, and optimize sessions via hooks, a web dashboard, and an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Manav Gupta", email = "manavg@gmail.com" },
]
keywords = [
    "claude",
    "claude-code",
    "context-window",
    "token-optimization",
    "token-usage",
    "llm",
    "mcp",
    "observability",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
# Optional deps for `context-tracker audit-headroom`. NOTE: headroom-ai is
# deliberately NOT listed here — it must be installed with
# `pip install --no-deps headroom-ai==0.32.1` (its litellm dependency has no
# wheels on macOS and is only needed for headroom's proxy paths, which the
# offline audit never touches). Extras cannot express --no-deps, so the
# subcommand prints the exact install command when headroom-ai is missing.
audit = [
    "tiktoken>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/manavgup/context-analyzer"
Repository = "https://github.com/manavgup/context-analyzer"
Issues = "https://github.com/manavgup/context-analyzer/issues"
Changelog = "https://github.com/manavgup/context-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
context-tracker = "context_tracker.cli:main"
context-tracker-hook = "context_tracker.hooks:main"
ccscope = "context_tracker.ccscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_tracker = ["static/*.html"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "S101",    # assert used in tests
    "B008",    # function call in default argument (FastAPI Depends)
    "PLR0913", # too many arguments (common in route handlers)
    "RUF059",  # unused unpacked variable (common in tuple returns)
    "S108",    # hardcoded temp paths (used in test fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ── Mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Optional audit-only deps (lazily imported by context_tracker.headroom_audit;
# never installed in CI). onnxruntime is only probed via find_spec, so it
# needs no override.
module = ["headroom", "headroom.*", "tiktoken"]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"

# ── Coverage ─────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/context_tracker"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
