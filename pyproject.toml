[build-system]
requires = ["setuptools>=78.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-tracker"
version = "0.1.0"
description = "MCP server for tracking Claude Code context window usage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
context-tracker = "context_tracker.server:main"
context-tracker-hook = "context_tracker.hooks:main"
ccscope = "context_tracker.ccscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "S101",    # assert used in tests
    "B008",    # function call in default argument (FastAPI Depends)
    "PLR0913", # too many arguments (common in route handlers)
    "RUF059",  # unused unpacked variable (common in tuple returns)
    "S108",    # hardcoded temp paths (used in test fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ── Mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"

# ── Coverage ─────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/context_tracker"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
