<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow Runs — Context Analyzer</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #5b9dff;
      --bar: #3a6ea5;
      --bar-cache: #6b4fa0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 { font-size: 18px; margin: 0; }
    input {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      min-width: 320px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    main { padding: 24px; max-width: 1100px; }
    .run {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .run-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: baseline;
    }
    .run-head .name { font-weight: 600; font-size: 15px; }
    .stat { color: var(--muted); font-size: 13px; }
    .stat b { color: var(--text); font-weight: 600; }
    .phase {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }
    .phase:first-of-type { border-top: none; }
    .phase-label {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 8px;
      word-break: break-word;
    }
    .phase-key { color: var(--muted); font-size: 11px; }
    .agent {
      display: grid;
      grid-template-columns: 220px 1fr 130px;
      gap: 12px;
      align-items: center;
      padding: 5px 0;
    }
    .agent .meta { font-size: 12px; }
    .agent .meta .type { color: var(--text); }
    .agent .meta .desc { color: var(--muted); }
    .barwrap {
      background: #11141a;
      border-radius: 4px;
      height: 16px;
      position: relative;
      overflow: hidden;
    }
    .bar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: var(--bar);
    }
    .bar.cache { background: var(--bar-cache); opacity: 0.55; }
    .nums { font-size: 12px; color: var(--muted); text-align: right; }
    .empty, .error { color: var(--muted); padding: 24px 0; }
    .error { color: #ff8080; }
    .legend { font-size: 11px; color: var(--muted); margin-left: auto; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Workflow Runs</h1>
    <input id="session" placeholder="session id" />
    <button id="load">Load</button>
    <span class="legend">
      <span class="swatch" style="background:var(--bar)"></span>peak resident
      <span class="swatch" style="background:var(--bar-cache);opacity:.55;margin-left:10px"></span>cache read
    </span>
  </header>
  <main id="out"><p class="empty">Enter a session id and click Load.</p></main>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (n || 0).toLocaleString();

    function sessionFromUrl() {
      const p = new URLSearchParams(location.search);
      return p.get("session") || p.get("session_id") || "";
    }

    function bar(value, max, cls) {
      const pct = max > 0 ? Math.max(2, (value / max) * 100) : 0;
      return `<div class="bar ${cls || ""}" style="width:${pct}%"></div>`;
    }

    function renderAgent(a, maxResident) {
      return `
        <div class="agent">
          <div class="meta">
            <div class="type">${a.agent_type}</div>
            <div class="desc">${(a.description || a.agent_id || "").slice(0, 60)}</div>
          </div>
          <div class="barwrap" title="peak ${fmt(a.peak_resident)} tok / cache ${fmt(a.total_cache_read)}">
            ${bar(a.peak_resident, maxResident)}
            ${bar(a.total_cache_read, maxResident, "cache")}
          </div>
          <div class="nums">
            ${fmt(a.peak_resident)} tok<br/>
            ${fmt(a.total_output_tokens)} out · ${a.total_api_calls} calls
          </div>
        </div>`;
    }

    function renderRun(run) {
      const maxResident = run.peak_resident || 1;
      const phases = (run.phases || []).map((ph) => {
        const agents = ph.agents.map((a) => renderAgent(a, maxResident)).join("");
        const label = ph.label ? ph.label : "(no label)";
        return `
          <div class="phase">
            <div class="phase-label">${label}
              <span class="phase-key">${ph.phase}</span>
            </div>
            ${agents}
          </div>`;
      }).join("");

      return `
        <div class="run">
          <div class="run-head">
            <span class="name">${run.name}</span>
            <span class="stat"><b>${run.total_agents}</b> agents</span>
            <span class="stat"><b>${run.total_phases}</b> phases</span>
            <span class="stat">peak <b>${fmt(run.peak_resident)}</b> tok</span>
            <span class="stat"><b>${fmt(run.total_output_tokens)}</b> output tok</span>
            <span class="stat">parallelism <b>${run.max_parallelism}</b></span>
          </div>
          ${phases}
        </div>`;
    }

    async function load() {
      const sid = $("session").value.trim();
      if (!sid) return;
      const out = $("out");
      out.innerHTML = '<p class="empty">Loading…</p>';
      try {
        const res = await fetch(`/api/session/${encodeURIComponent(sid)}/workflows`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.workflows || data.workflows.length === 0) {
          out.innerHTML = '<p class="empty">No workflow runs found for this session.</p>';
          return;
        }
        out.innerHTML = data.workflows.map(renderRun).join("");
      } catch (e) {
        out.innerHTML = `<p class="error">Failed to load: ${e.message}</p>`;
      }
    }

    $("load").addEventListener("click", load);
    $("session").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });

    const initial = sessionFromUrl();
    if (initial) { $("session").value = initial; load(); }
  </script>
</body>
</html>
